<form method="post" action="{% url 'accounts:resend' %}" novalidate>
  {% csrf_token %}
  <p>
    <label for="{{ form.email.id_for_label }}">Email address</label><br>
    {{ form.email }}
    {% if form.email.errors %}<span role="alert">{% for error in form.email.errors %}<br>{{ error }}{% endfor %}</span>{% endif %}
  </p>
  <button type="submit">Send a new link</button>
</form>
