{% extends "accounts/base.html" %}
{% block title %}Log out{% endblock %}
{% block content %}
<h1>Log out</h1>
<p>Logging out needs a button press, not a link, so a stray link on another site cannot log you out. Press the button to log out.</p>
<form method="post" action="{% url 'accounts:logout' %}">
  {% csrf_token %}
  <button type="submit">Log out</button>
</form>
{% endblock %}
