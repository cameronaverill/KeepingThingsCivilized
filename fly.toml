# Fly.io app config (docs/deployment_plan.md). Replace `app` below (fly generates a real name on first
# `fly launch`, or run `fly apps create <name>` yourself first).
#
# ONE process group ("web"), ONE always-on machine, running BOTH gunicorn and the litestream-wrapped moderator
# worker (scripts/fly_start.sh) -- see the plan's "hard constraint" section: SQLite has one writer, so this must
# never autoscale past one instance. This used to be two process groups (web, worker) on two separate machines
# sharing one [[mounts]] volume; that never actually worked (docs/deployment_plan.md item 9, 2026-09-28): a Fly
# Volume mounts read/write on exactly one host at a time, so the worker machine could never attach it and crashed
# on every single start (`DJANGO_DB_PATH points into a folder that does not exist: /data`), forever, with no
# moderator reply ever posted. Fixed by putting both processes on the one machine that holds the volume.

app = "think-together"
primary_region = "iad"  # pick the region nearest you; see `fly platform regions`

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_ENV = "production"
  DJANGO_DB_PATH = "/data/db.sqlite3"
  # Non-secret Litestream/B2 values from your bucket's own page -- fill in once the bucket exists (see litestream.yml).
  LITESTREAM_B2_BUCKET = "ThinkTogetherBucket"
  LITESTREAM_B2_ENDPOINT = "s3.us-east-005.backblazeb2.com"
  LITESTREAM_B2_REGION = "us-east-005" 
  # Secrets (never set here): DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS,
  # ANTHROPIC_API_KEY, EMAIL_BACKEND, EMAIL_HOST, EMAIL_PORT, EMAIL_USE_TLS, EMAIL_HOST_USER,
  # EMAIL_HOST_PASSWORD, ALERT_EMAIL, LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY --
  # set each with `fly secrets set NAME=value` (the B2 application key pair, scoped to the one bucket above).

[[mounts]]
  source = "think_together_data"  # create once: `fly volumes create think_together_data --size 1 --region iad`
  destination = "/data"

[processes]
  # `migrate` runs here, not as [deploy].release_command: Fly's release-command machine does not get the volume
  # mounted (it isn't guaranteed to run on the same host the volume lives on), so /data would not exist there.
  # web's own machine does have the volume, and web is pinned to exactly one instance, so this is safe.
  # Both gunicorn and the litestream-wrapped worker run here, on this one machine (scripts/fly_start.sh) -- see the
  # file header comment above for why they can no longer be two separate machines.
  web = "bash scripts/fly_start.sh"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the single web machine always on (see plan: no scale-to-zero, no scale-out)
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"  # was 512mb (web alone); this machine now also carries the worker's own full Django process
                      # plus litestream, so it needs the two previous machines' memory combined, not just web's.
                      # 256mb separately OOM-killed a gunicorn worker on real login traffic, 2026-09-28 -- see
                      # deployment_plan.md -- so this is not trimmed below the sum of the two prior sizes (768mb).
  processes = ["web"]
