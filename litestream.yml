# Continuous SQLite backup to Backblaze B2 (docs/deployment_plan.md). Baked into the image at /etc/litestream.yml;
# nothing in here is a secret, only names of Fly secrets Litestream reads at runtime.
# Backblaze bucket/endpoint/region come from B2's own bucket page once you create one (e.g. endpoint
# s3.us-west-004.backblazeb2.com, region us-west-004 -- both vary per bucket, fill in as Fly secrets, not here).
#
# To restore onto a fresh volume: `litestream restore -config /etc/litestream.yml /data/db.sqlite3`
dbs:
  - path: ${DJANGO_DB_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_B2_BUCKET}
        path: think-together
        endpoint: ${LITESTREAM_B2_ENDPOINT}
        region: ${LITESTREAM_B2_REGION}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
